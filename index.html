<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Important Message</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'fade-up-1': 'fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'fade-up-2': 'fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards',
                        'fade-up-3': 'fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.95s forwards',
                        'fade-in-btn': 'fadeIn 0.8s ease-out 1.45s forwards',
                        'wiggle-slow': 'wiggle 2.5s ease-in-out infinite',
                        'float-bounce': 'floatBounce 4s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeUp: {
                            '0%': { opacity: '0', transform: 'translateY(24px) scale(0.98)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        wiggle: {
                            '0%, 100%': { transform: 'rotate(-4deg)' },
                            '50%': { transform: 'rotate(4deg)' },
                        },
                        floatBounce: {
                            '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                            '50%': { transform: 'translateY(-18px) rotate(12deg)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-zinc-950 text-zinc-50 font-sans min-h-screen flex flex-col items-center justify-between p-4 sm:p-8 selection:bg-rose-500 selection:text-white overflow-hidden relative select-none">

    <!-- Subtle ambient background glow -->
    <div class="pointer-events-none fixed inset-0 flex items-center justify-center overflow-hidden">
        <div class="w-[300px] h-[300px] sm:w-[550px] sm:h-[550px] bg-rose-950/20 rounded-full blur-3xl"></div>
    </div>

    <!-- Floating/Bouncing Goofy Emojis Layer -->
    <div id="emoji-playground" class="pointer-events-none fixed inset-0 overflow-hidden z-0" aria-hidden="true">
        <span class="floating-emoji absolute top-[12%] left-[8%] text-3xl sm:text-5xl opacity-35 animate-float-bounce" style="animation-delay: 0s;">🤡</span>
        <span class="floating-emoji absolute top-[18%] right-[10%] text-3xl sm:text-5xl opacity-35 animate-float-bounce" style="animation-delay: 1.1s;">🦆</span>
        <span class="floating-emoji absolute bottom-[18%] left-[12%] text-3xl sm:text-5xl opacity-35 animate-float-bounce" style="animation-delay: 2.2s;">🍌</span>
        <span class="floating-emoji absolute bottom-[15%] right-[9%] text-3xl sm:text-5xl opacity-35 animate-float-bounce" style="animation-delay: 0.7s;">🤪</span>
    </div>

    <!-- Custom subtle trailing cursor dot for desktop -->
    <div id="custom-cursor" class="hidden md:block pointer-events-none fixed top-0 left-0 w-4 h-4 rounded-full bg-rose-500/80 mix-blend-screen -translate-x-1/2 -translate-y-1/2 transition-transform duration-150 ease-out z-50"></div>

    <!-- Top Bar: Live Time Wasted Stopwatch & Mute Toggle -->
    <header class="relative z-20 w-full max-w-5xl flex flex-wrap items-center justify-between gap-3 pt-1">
        <div class="inline-flex items-center gap-2.5 px-4 py-2 rounded-full bg-zinc-900/90 border border-zinc-800/80 shadow-md backdrop-blur-sm">
            <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping"></span>
            <span class="text-xs sm:text-sm font-medium text-zinc-300">
                Official Time Wasted: <strong id="stopwatch-display" class="font-mono font-bold text-rose-400">0.0s</strong> and counting...
            </span>
        </div>

        <button 
            id="mute-btn"
            type="button"
            class="inline-flex items-center gap-2 px-3.5 py-2 rounded-full bg-zinc-900/90 hover:bg-zinc-800 border border-zinc-800 text-xs sm:text-sm font-medium text-zinc-300 transition-colors cursor-pointer"
            aria-label="Toggle Goofy Sound Effects"
        >
            <span id="mute-icon">🔊</span>
            <span id="mute-label" class="hidden sm:inline">Goofy SFX: ON</span>
        </button>
    </header>

    <!-- Main Centered Typography Container -->
    <main class="relative z-10 max-w-4xl w-full text-center flex flex-col items-center justify-center my-auto py-6">
        <!-- Spinning Goofy Badge -->
        <div id="goofy-badge" class="mb-4 sm:mb-6 inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-amber-500/10 border border-amber-400/30 text-amber-300 text-xs sm:text-sm font-semibold animate-wiggle-slow cursor-pointer" title="Click me for a honk!">
            <span class="inline-block animate-spin" style="animation-duration: 6s;">🎪</span>
            <span>CERTIFIED TIME-WASTER</span>
        </div>

        <h1 class="flex flex-col items-center justify-center space-y-2 sm:space-y-4 tracking-tight">
            <!-- Line 1 -->
            <span class="opacity-0 animate-fade-up-1 text-2xl sm:text-4xl md:text-5xl font-semibold text-zinc-300">
                Thank you for wasting your time
            </span>
            
            <!-- Line 2 (Punchline) -->
            <span class="opacity-0 animate-fade-up-2 text-5xl sm:text-7xl md:text-8xl font-black text-white tracking-tighter py-1 sm:py-2 hover:scale-[1.03] transition-transform duration-300 cursor-default">
                Now Get Lost
            </span>
            
            <!-- Line 3 -->
            <span class="opacity-0 animate-fade-up-3 text-xl sm:text-3xl md:text-4xl font-semibold text-zinc-400">
                And send it to another person
            </span>
        </h1>

        <!-- Interactive Buttons Area -->
        <div class="opacity-0 animate-fade-in-btn mt-10 sm:mt-14 flex flex-wrap items-center justify-center gap-4">
            <button 
                id="copy-btn"
                type="button"
                class="group relative inline-flex items-center justify-center gap-3 px-6 py-3.5 sm:px-8 sm:py-4 text-sm sm:text-base font-semibold text-zinc-950 bg-zinc-100 hover:bg-white active:scale-95 rounded-full shadow-lg shadow-white/5 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-zinc-400 focus:ring-offset-2 focus:ring-offset-zinc-950 cursor-pointer"
                aria-label="Copy Link to Prank Someone Else"
            >
                <!-- Copy Icon -->
                <svg id="icon-copy" class="w-5 h-5 text-zinc-800 transition-transform duration-200 group-hover:rotate-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
                <!-- Check Icon (Hidden by default) -->
                <svg id="icon-check" class="w-5 h-5 text-emerald-600 hidden" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                </svg>
                <span id="btn-text">Copy Link to Prank Someone Else</span>
            </button>

            <!-- Initial Placeholder for Runaway Leave Button -->
            <div id="runaway-anchor" class="inline-block">
                <button
                    id="runaway-btn"
                    type="button"
                    class="inline-flex items-center justify-center gap-2 px-6 py-3.5 sm:px-7 sm:py-4 text-sm sm:text-base font-bold text-rose-200 bg-rose-600/20 hover:bg-rose-600/30 border border-rose-500/40 rounded-full shadow-lg transition-all duration-150 cursor-pointer z-30"
                >
                    <span>🚪</span>
                    <span id="runaway-text">Leave Page</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Bottom Subtle Footer Hint -->
    <footer class="relative z-10 text-center pb-1">
        <p id="dodge-counter-text" class="text-xs text-zinc-500 transition-opacity duration-300 opacity-0">
            Escape attempts failed: <span id="dodge-count" class="font-bold text-zinc-300">0</span> 🤡
        </p>
    </footer>

    <!-- Confirmation Toast Notification -->
    <div 
        id="toast" 
        role="status" 
        aria-live="polite"
        class="fixed bottom-6 sm:bottom-8 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2.5 px-5 py-3 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-100 text-sm font-medium shadow-2xl opacity-0 translate-y-4 pointer-events-none transition-all duration-300"
    >
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Link copied! Go ruin someone's focus.</span>
    </div>

    <!-- Hidden textarea fallback for iframe-safe clipboard copying -->
    <textarea id="clipboard-helper" class="sr-only" aria-hidden="true" tabindex="-1"></textarea>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const copyBtn = document.getElementById('copy-btn');
            const btnText = document.getElementById('btn-text');
            const iconCopy = document.getElementById('icon-copy');
            const iconCheck = document.getElementById('icon-check');
            const toast = document.getElementById('toast');
            const clipboardHelper = document.getElementById('clipboard-helper');
            const customCursor = document.getElementById('custom-cursor');

            // Goofy feature elements
            const stopwatchDisplay = document.getElementById('stopwatch-display');
            const runawayBtn = document.getElementById('runaway-btn');
            const runawayText = document.getElementById('runaway-text');
            const dodgeCounterText = document.getElementById('dodge-counter-text');
            const dodgeCountEl = document.getElementById('dodge-count');
            const muteBtn = document.getElementById('mute-btn');
            const muteIcon = document.getElementById('mute-icon');
            const muteLabel = document.getElementById('mute-label');
            const goofyBadge = document.getElementById('goofy-badge');

            let toastTimeout = null;
            let btnTimeout = null;
            let isMuted = false;
            let dodgeCount = 0;
            let isEscaping = false;

            const taunts = [
                "Too slow! 😜",
                "Nope! 🦆",
                "Nice try! 🤡",
                "You're stuck here!",
                "Almost! 🍌",
                "Can't catch me!",
                "Error 404: Exit not found",
                "Stay a little longer!",
                "Whoops, missed!",
                "Not today! 🤪"
            ];

            // --- 1. Live "Time Wasted" Stopwatch ---
            const startTime = performance.now();
            function updateStopwatch() {
                const elapsedSeconds = (performance.now() - startTime) / 1000;
                stopwatchDisplay.textContent = `${elapsedSeconds.toFixed(1)}s`;
                requestAnimationFrame(updateStopwatch);
            }
            requestAnimationFrame(updateStopwatch);

            // --- 2. Web Audio API Goofy Sound Synthesizer ---
            let audioCtx = null;
            function getAudioContext() {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) {
                        audioCtx = new AudioContextClass();
                    }
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
                return audioCtx;
            }

            // Play a springy "Boing" sound when the runaway button dodges
            function playBoingSound() {
                if (isMuted) return;
                const ctx = getAudioContext();
                if (!ctx) return;

                try {
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.exponentialRampToValueAtTime(520, now + 0.14);
                    osc.frequency.exponentialRampToValueAtTime(240, now + 0.28);

                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.31);
                } catch (e) {}
            }

            // Play a clown/duck "Honk" sound
            function playHonkSound() {
                if (isMuted) return;
                const ctx = getAudioContext();
                if (!ctx) return;

                try {
                    const now = ctx.currentTime;
                    const osc1 = ctx.createOscillator();
                    const osc2 = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc1.type = 'sawtooth';
                    osc2.type = 'triangle';
                    osc1.frequency.setValueAtTime(290, now);
                    osc1.frequency.linearRampToValueAtTime(235, now + 0.18);
                    osc2.frequency.setValueAtTime(295, now);
                    osc2.frequency.linearRampToValueAtTime(240, now + 0.18);

                    gain.gain.setValueAtTime(0.14, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

                    osc1.connect(gain);
                    osc2.connect(gain);
                    gain.connect(ctx.destination);

                    osc1.start(now);
                    osc2.start(now);
                    osc1.stop(now + 0.23);
                    osc2.stop(now + 0.23);
                } catch (e) {}
            }

            // Play a cheerful celebratory chime + slide whistle on copy
            function playCelebrateSound() {
                if (isMuted) return;
                const ctx = getAudioContext();
                if (!ctx) return;

                try {
                    const now = ctx.currentTime;
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.06);

                        gain.gain.setValueAtTime(0.14, now + idx * 0.06);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.25);

                        osc.connect(gain);
                        gain.connect(ctx.destination);

                        osc.start(now + idx * 0.06);
                        osc.stop(now + idx * 0.06 + 0.26);
                    });
                } catch (e) {}
            }

            // Mute toggle button
            muteBtn.addEventListener('click', () => {
                isMuted = !isMuted;
                muteIcon.textContent = isMuted ? '🔇' : '🔊';
                muteLabel.textContent = isMuted ? 'Goofy SFX: OFF' : 'Goofy SFX: ON';
                if (!isMuted) playHonkSound();
            });

            // Clicking the spinning badge plays a clown honk and spawns mini emojis
            goofyBadge.addEventListener('click', (e) => {
                playHonkSound();
                spawnEmojiBurst(e.clientX, e.clientY, 10);
            });

            // --- 3. Runaway "Leave Page" Button ---
            function dodgeButton(e) {
                if (e) e.preventDefault();
                playBoingSound();

                dodgeCount++;
                dodgeCountEl.textContent = dodgeCount;
                dodgeCounterText.classList.remove('opacity-0');
                dodgeCounterText.classList.add('opacity-100');

                // Pick a funny taunt
                const randomTaunt = taunts[Math.floor(Math.random() * taunts.length)];
                runawayText.textContent = randomTaunt;

                // Switch button to fixed positioning on first dodge so it can roam the viewport safely
                if (!isEscaping) {
                    const rect = runawayBtn.getBoundingClientRect();
                    runawayBtn.style.position = 'fixed';
                    runawayBtn.style.left = `${rect.left}px`;
                    runawayBtn.style.top = `${rect.top}px`;
                    runawayBtn.style.margin = '0';
                    isEscaping = true;
                }

                // Calculate safe random coordinates inside viewport with padding
                const padding = 24;
                const btnRect = runawayBtn.getBoundingClientRect();
                const maxX = Math.max(padding, window.innerWidth - btnRect.width - padding);
                const maxY = Math.max(padding + 56, window.innerHeight - btnRect.height - padding);

                let nextX = padding + Math.random() * (maxX - padding);
                let nextY = (padding + 56) + Math.random() * (maxY - (padding + 56));

                // Ensure it jumps a noticeable distance from its current spot
                if (Math.abs(nextX - btnRect.left) < 90) {
                    nextX = btnRect.left > window.innerWidth / 2 ? padding + 20 : maxX - 20;
                }

                const randomTilt = (Math.random() - 0.5) * 24;
                runawayBtn.style.left = `${nextX}px`;
                runawayBtn.style.top = `${nextY}px`;
                runawayBtn.style.transform = `rotate(${randomTilt}deg) scale(1.05)`;
            }

            runawayBtn.addEventListener('mouseenter', dodgeButton);
            runawayBtn.addEventListener('touchstart', dodgeButton, { passive: false });
            runawayBtn.addEventListener('click', dodgeButton);

            // Keep runaway button inside screen on window resize
            window.addEventListener('resize', () => {
                if (!isEscaping) return;
                const rect = runawayBtn.getBoundingClientRect();
                const clampedX = Math.min(Math.max(16, rect.left), window.innerWidth - rect.width - 16);
                const clampedY = Math.min(Math.max(64, rect.top), window.innerHeight - rect.height - 16);
                runawayBtn.style.left = `${clampedX}px`;
                runawayBtn.style.top = `${clampedY}px`;
            });

            // --- 4. Confetti / Goofy Emoji Burst on Copy ---
            function spawnEmojiBurst(originX, originY, count = 24) {
                const burstEmojis = ['🤡', '🦆', '🍌', '🤪', '🎉', '💀', '😂', '🚀'];
                for (let i = 0; i < count; i++) {
                    const el = document.createElement('span');
                    el.textContent = burstEmojis[Math.floor(Math.random() * burstEmojis.length)];
                    el.className = 'pointer-events-none fixed z-50 text-2xl sm:text-3xl select-none';
                    el.style.left = `${originX}px`;
                    el.style.top = `${originY}px`;
                    document.body.appendChild(el);

                    const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
                    const velocity = 90 + Math.random() * 190;
                    const destX = Math.cos(angle) * velocity;
                    const destY = Math.sin(angle) * velocity - 60;
                    const spin = (Math.random() - 0.5) * 540;

                    const anim = el.animate([
                        { transform: 'translate(-50%, -50%) scale(0.4) rotate(0deg)', opacity: 1 },
                        { transform: `translate(calc(-50% + ${destX}px), calc(-50% + ${destY}px)) scale(1.2) rotate(${spin}deg)`, opacity: 1, offset: 0.7 },
                        { transform: `translate(calc(-50% + ${destX * 1.15}px), calc(-50% + ${destY + 90}px)) scale(0.7) rotate(${spin * 1.2}deg)`, opacity: 0 }
                    ], {
                        duration: 900 + Math.random() * 400,
                        easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
                        fill: 'forwards'
                    });

                    anim.onfinish = () => el.remove();
                }
            }

            // Subtle trailing cursor effect on desktop pointers
            window.addEventListener('mousemove', (e) => {
                if (!customCursor) return;
                customCursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0) translate(-50%, -50%)`;
            });

            // Scale cursor slightly on interactive hover
            copyBtn.addEventListener('mouseenter', () => {
                if (customCursor) customCursor.classList.add('scale-150');
            });
            copyBtn.addEventListener('mouseleave', () => {
                if (customCursor) customCursor.classList.remove('scale-150');
            });

            // Reliable clipboard copy function (works in standard browsers & sandboxed iframes)
            function copyCurrentUrl(e) {
                const urlToCopy = window.location.href;
                const rect = copyBtn.getBoundingClientRect();
                const burstX = (e && e.clientX) ? e.clientX : rect.left + rect.width / 2;
                const burstY = (e && e.clientY) ? e.clientY : rect.top + rect.height / 2;

                playCelebrateSound();
                spawnEmojiBurst(burstX, burstY, 26);
                
                try {
                    clipboardHelper.value = urlToCopy;
                    clipboardHelper.select();
                    clipboardHelper.setSelectionRange(0, 99999);
                    const successful = document.execCommand('copy');
                    
                    if (!successful && navigator.clipboard) {
                        navigator.clipboard.writeText(urlToCopy);
                    }
                    triggerFeedback();
                } catch (err) {
                    // Fallback attempt
                    if (navigator.clipboard) {
                        navigator.clipboard.writeText(urlToCopy).then(triggerFeedback).catch(() => {});
                    }
                }
            }

            // Show visual feedback on button and toast
            function triggerFeedback() {
                // Update button state
                btnText.textContent = 'Copied! Pass it on';
                iconCopy.classList.add('hidden');
                iconCheck.classList.remove('hidden');

                // Show toast
                toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
                toast.classList.add('opacity-100', 'translate-y-0');

                // Clear existing timers if clicked repeatedly
                clearTimeout(btnTimeout);
                clearTimeout(toastTimeout);

                btnTimeout = setTimeout(() => {
                    btnText.textContent = 'Copy Link to Prank Someone Else';
                    iconCopy.classList.remove('hidden');
                    iconCheck.classList.add('hidden');
                }, 2500);

                toastTimeout = setTimeout(() => {
                    toast.classList.remove('opacity-100', 'translate-y-0');
                    toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
                }, 3000);
            }

            copyBtn.addEventListener('click', copyCurrentUrl);
        });
    </script>
</body>
</html>
